repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml carries `!!python/name:` and `!!python/object/apply:` tags —
        # that is how mkdocs is handed a callable (the emoji generators, the
        # GitHub-compatible slugifier). `safe_load` refuses to construct them, so
        # the hook reports a valid config as broken. mkdocs parses it on every
        # build, and CI builds strictly, so it is not unchecked.
        exclude: ^mkdocs\.yml$
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Deliberately a local hook rather than facebook/pyrefly-pre-commit: that hook
  # is `language: python`, so it type-checks against pre-commit's own isolated
  # venv, where pydantic/pandas/xarray/linopy do not exist. With missing-import
  # promoted to error (pyproject.toml) every third-party import would fail.
  # Running through uv points pyrefly at the project venv, which is the whole
  # point of checking imports.
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly check
        entry: uv run pyrefly check
        language: system
        types_or: [python, pyi]
        pass_filenames: false  # pyrefly reads project-includes from pyproject.toml
        require_serial: true
