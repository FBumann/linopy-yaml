site_name: lpspec
site_description: Self-documenting optimisation models — declarative LP/MILP, built relationally and handed straight to the solver
site_url: https://lpspec.readthedocs.io/en/latest/
repo_url: https://github.com/fluxopt/lpspec
repo_name: fluxopt/lpspec
edit_uri: edit/main/docs/
strict: true

# `docs/` is the site *and* what contributors read on GitHub, so every page here
# is a file that already had to make sense on its own. Two consequences:
#
#   - `README.md` stays as the folder view GitHub renders when you browse to
#     `docs/`, and is excluded from the site, where `index.md` does that job.
#   - A link to something *outside* `docs/` is written as a full GitHub URL, not
#     as `../CONTRIBUTING.md` — the site has no such file, and a relative link
#     would resolve in the repo and 404 here. `tests/test_docs_site.py` enforces
#     both halves of that. Everything inside `docs/` stays relative and mkdocs
#     validates it.
exclude_docs: |
  README.md
  # rendered locally by the presentation script and gitignored; the chart page
  # (benchmarks-scaling.html) is a source and stays.
  relational.html
  relational.pdf

validation:
  # Under `strict: true` a warning is a failed build, which is the point: a
  # model page added without a nav entry, or a link that stopped resolving,
  # fails CI rather than shipping.
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Write a model: guide.md
  - Change a model:
      - The three loops: interactive.ipynb
      - Fix, relax, remove: lifecycle.ipynb
  - Examples:
      - examples/index.md
      - Preparing the data: examples/data.md
      - Teaching examples:
          - dispatch: examples/dispatch.md
          - storage: examples/storage.md
          - transport: examples/transport.md
          - piecewise: examples/piecewise.md
          - special-ordered sets: examples/sos.md
          - monthly budget: examples/monthly_budget.md
          - multi-period: examples/multi_period.md
          - reserves: examples/reserves.md
          - walkthrough: examples/walkthrough.md
      - The PyPSA ladder:
          - rung 1 — transport: examples/pypsa_transport.md
          - rung 2 — ramp limits: examples/pypsa_ramp.md
          - rung 3 — storage: examples/pypsa_storage.md
          - rung 4 — cyclic storage: examples/pypsa_cyclic_storage.md
          - rung 5 — KVL: examples/pypsa_kvl.md
          - transmission losses: examples/pypsa_losses.md
          - rung 6 — AC-DC, two coordinates: examples/pypsa_ac_dc.md
      - PyPSA components and modes:
          - unit commitment: examples/pypsa_unit_commitment.md
          - minimum up and down times: examples/pypsa_min_up_down.md
          - linearized unit commitment: examples/pypsa_linearized_uc.md
          - global limits: examples/pypsa_global_limits.md
          - multi-link: examples/pypsa_multilink.md
          - modular capacity: examples/pypsa_modular.md
          - energy totals: examples/pypsa_energy_sum.md
          - fixed by data: examples/pypsa_fixed.md
          - spillage: examples/pypsa_spill.md
          - the Store component: examples/pypsa_store.md
          - link delay: examples/pypsa_link_delay.md
          - multi-period investment: examples/pypsa_multi_period.md
      - Published optima:
          - Dantzig transport: examples/transport_dantzig.md
          - Dantzig, economies of scale: examples/transport_pwl.md
          - Stigler's diet: examples/stigler_diet.md
          - Facility location: examples/facility_location.md
          - GenX piecewise fuel: examples/genx_piecewise_fuel.md
          - Routing telephone calls: examples/telephone_routing.md
          - Choosing the mode of transport: examples/transport_modes.md
          - OSeMOSYS UTOPIA: examples/osemosys_utopia.md
          - Travelling salesman: examples/tsp_mtz.md
  - Reference:
      - Language:
          - reference/language/index.md
          - File shape: reference/language/file.md
          - Dimensions and lookups: reference/language/dimensions.md
          - Parameters, variables, constraints: reference/language/declarations.md
          - Expressions: reference/language/expressions.md
          - Operators: reference/language/operators.md
          - Absence and where: reference/language/absence.md
          - Piecewise curves and SOS: reference/language/piecewise.md
          - Data binding: reference/language/data.md
          - Errors and limits: reference/language/errors.md
      - Python API: reference/api.md
      - Sweeps and rolling horizons: reference/sweeps.md
      - Typeset the math: reference/typeset.md
  # Everything a reader does not need in order to write or run a model: design
  # notes, measured cost, project direction. One section, so the user path
  # above stays the whole of the top level.
  - About:
      - about/index.md
      - Architecture: about/architecture.md
      - The ceiling: about/ceiling.md
      - Decomposition: about/decomposition.md
      - Benchmarks: about/benchmarks.md
      # A source file, not a generated page: mkdocs copies it through and the
      # nav links it like any other. It is the same data as the figures on the
      # page above, with a cursor — which is the whole reason it is reachable
      # from the nav rather than from one link mid-paragraph.
      - Benchmarks (interactive): about/benchmarks-scaling.html
      - Relationship to linopy: about/linopy.md
      - Prior art and credit: about/prior-art.md
      - Roadmap: about/roadmap.md
      - Changelog: about/changelog.md

theme:
  name: material
  language: en

  palette:
    # Dark first = default for new visitors (no auto/system-pref entry).
    # Icon represents the CURRENT scheme — moon when active is dark,
    # sun when active is light. The `name` describes the toggle action.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

  font:
    text: Roboto
    code: JetBrains Mono

  icon:
    repo: fontawesome/brands/github

  features:
    - header.autohide
    # navigation.instant left off — MathJax fails to re-typeset on
    # no-math → math swaps, and no documented reset recipe fixes it.
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub's slug rules, not mkdocs'. The pages here are read in both
      # places and already cross-link by anchor — `ROADMAP.md#track-4--sink-
      # capabilities`, whose double hyphen is the em dash GitHub drops. The
      # default slugifier collapses that to one, so every such link would 404
      # on the site while working in the repo. Same file, same anchor, both
      # renderings.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        # README and ARCHITECTURE both draw the lane diagram in mermaid.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - include-markdown
  # `docs/interactive.ipynb` ships with its cells cleared (the nbstripout hook
  # in .pre-commit-config.yaml), so the outputs on the page are this build's:
  # every number, frame and rendered equation came from the code above it, on
  # the commit being built. `allow_errors: false` makes a cell that raises fail
  # the build, which is what stops the page from teaching a call that no longer
  # works — the same bargain nbsphinx strikes for linopy's tutorials.
  #
  # Execution needs the package and a kernel, which is why `.readthedocs.yaml`
  # installs the project and the `docs` group carries ipykernel.
  - mkdocs-jupyter:
      execute: true
      allow_errors: false
      include_source: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fluxopt/lpspec
      name: lpspec on GitHub
    - icon: simple/pypi
      link: https://pypi.org/project/lpspec/
      name: lpspec on PyPI

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

watch:
  - docs
  - README.md
  - CHANGELOG.md
