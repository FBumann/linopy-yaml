# The whole problem in one plan. The spike's ground truth: whatever the
# decomposition converges to has to equal this objective.
dimensions:
  snapshot:
    dtype: int
  generator:
    values: [wind, gas]

parameters:
  invest:
    dims: [generator]
  cost:
    dims: [generator]
  load:
    dims: [snapshot]
  avail:
    dims: [snapshot, generator]
  voll:
    dims: []

variables:
  cap:
    foreach: [generator]
    bounds:
      lower: 0
      upper: 100
  p:
    foreach: [snapshot, generator]
    bounds:
      lower: 0
  unserved:
    foreach: [snapshot]
    bounds:
      lower: 0

constraints:
  capacity:
    foreach: [snapshot, generator]
    expression: p <= cap * avail
  balance:
    foreach: [snapshot]
    expression: sum(p, over=generator) + unserved >= load

objectives:
  total_cost:
    sense: minimize
    expression: cap * invest + p * cost + unserved * voll
