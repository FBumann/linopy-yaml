# The subproblem: dispatch at a capacity someone else chose.
#
# `cap_hat` is a parameter here where it was a variable in the monolith — that
# substitution is the whole of the split, and it is the shape `solve_over`'s
# `carry` already moves (a parameter fed from another plan's variable).
#
# `unserved` at `voll` keeps this feasible for every capacity, which is what
# lets the spike need optimality cuts only. Feasibility cuts are a real part of
# Benders and deliberately out of scope: they change the algorithm, not the seam.
dimensions:
  snapshot:
    dtype: int
  generator:
    values: [wind, gas]

parameters:
  cost:
    dims: [generator]
  load:
    dims: [snapshot]
  avail:
    dims: [snapshot, generator]
  voll:
    dims: []
  cap_hat:
    dims: [generator]

variables:
  p:
    foreach: [snapshot, generator]
    bounds:
      lower: 0
  unserved:
    foreach: [snapshot]
    bounds:
      lower: 0

constraints:
  capacity:
    foreach: [snapshot, generator]
    expression: p <= cap_hat * avail
  balance:
    foreach: [snapshot]
    expression: sum(p, over=generator) + unserved >= load

objectives:
  operating_cost:
    sense: minimize
    expression: p * cost + unserved * voll
