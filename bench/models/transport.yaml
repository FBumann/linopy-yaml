# examples/transport.yaml verbatim, kept here so a bench model never changes
# because an example was edited for documentation reasons. Three sum
# calls per balance row: the join-heavy shape.
dimensions:
  snapshot:
    dtype: int
  generator:
    dtype: str
  bus:
    dtype: str
  line:
    dtype: str

lookups:
  gen_bus: {over: generator, into: bus}  # every generator sits on a bus
  line_from: {over: line, into: bus}  # both endpoints are buses
  line_to: {over: line, into: bus}

parameters:
  p_max:
    dims: [generator]
  cost:
    dims: [generator]
  cap:
    dims: [line]
  neg_cap:
    dims: [line]
  load:
    dims: [snapshot, bus]

variables:
  p:
    foreach: [snapshot, generator]
    bounds:
      lower: 0
      upper: p_max
  f:
    foreach: [snapshot, line]
    bounds:
      lower: neg_cap
      upper: cap

constraints:
  balance:
    foreach: [snapshot, bus]
    expression: sum(p, by=gen_bus) + sum(f, by=line_to) - sum(f, by=line_from) == load

objective:
  sense: minimize
  expression: p * cost
