# Mixed density: dense in one axis, sparse in another, in one model.
#
# `nodal` is sparse everywhere it can be and `dispatch` is dense everywhere,
# and neither is what a sector-coupled model looks like. This one crosses the
# two: snapshots and carriers are dense, the node x tech portfolio is sparse,
# and the technology-to-carrier map is sparser still — a technology produces
# one carrier, not five.
#
# The shape that makes it interesting is `sum(p * produces, over=tech)`. The
# variable is indexed by (snapshot, node, tech); `produces` carries (tech,
# carrier); so the product broadcasts a *dense* dim onto a *sparse* frame and
# the reduction then removes the sparse one. An engine that is only good at
# one of the two densities has nowhere to hide.
#
# Demand exists only where a node's portfolio can serve it, and the balance
# carries `where: demand` so the row set follows: an unreachable (node,
# carrier) pair is not a vacuous `0 == 0` row, it is no row.
dimensions:
  snapshot:
    dtype: int
  node:
    dtype: str
  tech:
    dtype: str
  carrier:
    dtype: str

parameters:
  installed:            # capacity of `tech` at `node`; absent pairs are zero
    dims: [node, tech]
  produces:             # unit of `tech` output arriving as `carrier`
    dims: [tech, carrier]
  cost:
    dims: [tech]
  demand:
    dims: [snapshot, node, carrier]

variables:
  p:
    foreach: [snapshot, node, tech]
    where: "installed > 0"
    bounds:
      lower: 0
      upper: installed

constraints:
  balance:
    foreach: [snapshot, node, carrier]
    where: "demand"
    expression: sum(p * produces, over=tech) == demand

objective:
  sense: minimize
  expression: sum(p * cost)

