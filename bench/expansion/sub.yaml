# Dispatch at a capacity someone else chose, or nothing.
#
# `cap_hat * avail` is a product of two parameters, so it reaches the rows as a
# right-hand side: a new capacity pushes values onto the loaded solver and
# never rebuilds. The subproblem is therefore *not* the case this module
# measures — it is what makes the loop expensive enough to be worth a master.
dimensions:
  snapshot: {dtype: int}
  generator: {dtype: str}

parameters:
  cost: {dims: [generator]}
  load: {dims: [snapshot]}
  avail: {dims: [snapshot, generator]}
  cap_hat: {dims: [generator]}

variables:
  p:
    foreach: [snapshot, generator]
    bounds: {lower: 0}

constraints:
  capacity:
    foreach: [snapshot, generator]
    expression: p <= cap_hat * avail
  balance:
    foreach: [snapshot]
    expression: sum(p, over=generator) >= load

objective:
  sense: minimize
  expression: p * cost
