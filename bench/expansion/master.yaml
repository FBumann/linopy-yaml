# The Benders master of a capacity expansion, sized from data.
#
# `examples/benders/master.yaml` said in two generators; this says the same
# math with `generator` taking its members from data, so the master's column
# count is a knob. Both cut families are declared once and grow as rows: an
# *optimality* cut prices operating a capacity, a *feasibility* cut says a
# capacity cannot be operated at all and carries no `theta`.
#
# `optimality_cut` is declared before `feasibility_cut`, so a row gained by the
# first shifts every row of the second — the reason a basis carried across a
# rebuild has to be spliced per declaration rather than truncated.
dimensions:
  generator: {dtype: str}
  cut: {dtype: int}
  fcut: {dtype: int}

parameters:
  invest: {dims: [generator]}
  cap_max: {dims: [generator]}
  cut_const: {dims: [cut]}
  cut_slope: {dims: [cut, generator]}
  fcut_const: {dims: [fcut]}
  fcut_slope: {dims: [fcut, generator]}

variables:
  cap:
    foreach: [generator]
    bounds: {lower: 0, upper: cap_max}
  theta:
    foreach: []
    bounds: {lower: 0}

constraints:
  optimality_cut:
    foreach: [cut]
    expression: theta >= cut_const + sum(cut_slope * cap, over=generator)
  feasibility_cut:
    foreach: [fcut]
    expression: sum(fcut_slope * cap, over=generator) <= fcut_const

objective:
  sense: minimize
  expression: cap * invest + theta
