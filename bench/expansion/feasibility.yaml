# How far from dispatchable a capacity is, when it is too small.
#
# An infeasible solve leaves no duals to read, so the violation is minimised
# instead: its optimum is zero exactly when `sub.yaml` is feasible, and its
# capacity duals are the subgradient a feasibility cut needs.
dimensions:
  snapshot: {dtype: int}
  generator: {dtype: str}

parameters:
  load: {dims: [snapshot]}
  avail: {dims: [snapshot, generator]}
  cap_hat: {dims: [generator]}

variables:
  p:
    foreach: [snapshot, generator]
    bounds: {lower: 0}
  short:
    foreach: [snapshot]
    bounds: {lower: 0}

constraints:
  capacity:
    foreach: [snapshot, generator]
    expression: p <= cap_hat * avail
  balance:
    foreach: [snapshot]
    expression: sum(p, over=generator) + short >= load

objective:
  sense: minimize
  expression: sum(short)
