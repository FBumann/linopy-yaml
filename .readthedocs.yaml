version: 2

build:
  os: ubuntu-24.04
  # `commands:` takes the build over entirely: no `tools.python` for Read the
  # Docs to install and no virtualenv for an install step to be pointed at. pixi
  # brings its own interpreter, so the environment the site is built in here is
  # the environment named in pyproject.toml and nothing else.
  #
  # `docs` is the same environment `ci` builds strictly, so a page that builds
  # there builds here, and a dependency one of them needs cannot be one the
  # other lacks — the environment is named, not assembled twice.
  #
  # The docs environment carries the project as well as the toolchain, because
  # mkdocs.yml executes `docs/interactive.ipynb` during the build and its first
  # cell imports lpspec. A page whose outputs are this build's own is what that
  # buys, and there is no way to have it without running the package here.
  #
  # The installer is one request, unpinned, matching `prefix-dev/setup-pixi` in
  # the workflows: pixi floats there or nowhere. It is invoked by path because
  # each command runs in its own shell, so what the installer appended to the
  # profile is not in scope for the next line.
  commands:
    - curl -fsSL https://pixi.sh/install.sh | bash
    - ~/.pixi/bin/pixi run docs-build --site-dir "$READTHEDOCS_OUTPUT/html"
