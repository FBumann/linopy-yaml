dimensions:
  snapshot:
    dtype: int
  generator:
    dtype: str
  bus:
    dtype: str
  line:
    dtype: str

lookups:
  gen_bus: {over: generator, into: bus}  # every generator sits on a bus
  from: {over: line, into: bus}  # both endpoints are buses
  to: {over: line, into: bus}

parameters:
  p_max:
    dims: [generator]
  cost:
    dims: [generator]
  cap:
    dims: [line]
  neg_cap:
    dims: [line]
  load:
    dims: [snapshot, bus]

variables:
  p:
    foreach: [snapshot, generator]
    bounds:
      lower: 0
      upper: p_max
  f:
    foreach: [snapshot, line]
    bounds:
      lower: neg_cap
      upper: cap

expressions:
  gen_at_bus: sum(p, by=gen_bus)
  net_inflow: sum(f, by=to) - sum(f, by=from)

constraints:
  balance:
    foreach: [snapshot, bus]
    expression: gen_at_bus + net_inflow == load

objective:
  sense: minimize
  expression: p * cost
