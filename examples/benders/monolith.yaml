# The true problem, with no unserved-energy escape. This is the oracle the
# decomposition must reach, and it is a harder one than `monolith.yaml`: a
# capacity that cannot serve the load is infeasible rather than expensive.
dimensions:
  snapshot: {dtype: int}
  generator: {values: [wind, gas]}
parameters:
  invest: {dims: [generator]}
  cost: {dims: [generator]}
  load: {dims: [snapshot]}
  avail: {dims: [snapshot, generator]}
variables:
  cap:
    foreach: [generator]
    bounds: {lower: 0, upper: 100}
  p:
    foreach: [snapshot, generator]
    bounds: {lower: 0}
constraints:
  capacity:
    foreach: [snapshot, generator]
    expression: p <= cap * avail
  balance:
    foreach: [snapshot]
    expression: sum(p, over=generator) >= load
objectives:
  total_cost:
    sense: minimize
    expression: cap * invest + p * cost
