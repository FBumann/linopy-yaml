# Two cut families, because a subproblem can fail in two ways.
#
# An *optimality* cut says what operating a capacity costs. A *feasibility* cut
# says a capacity cannot be operated at all, and carries no `theta`: it is a
# statement about `cap` alone. Both are declared once and grow as data.
dimensions:
  generator: {values: [wind, gas]}
  cut: {dtype: int}
  fcut: {dtype: int}
parameters:
  invest: {dims: [generator]}
  cut_const: {dims: [cut]}
  cut_slope: {dims: [cut, generator]}
  fcut_const: {dims: [fcut]}
  fcut_slope: {dims: [fcut, generator]}
variables:
  cap:
    foreach: [generator]
    bounds: {lower: 0, upper: 100}
  theta:
    foreach: []
    bounds: {lower: 0}
constraints:
  optimality_cut:
    foreach: [cut]
    expression: theta >= cut_const + sum(cut_slope * cap, over=generator)
  feasibility_cut:
    foreach: [fcut]
    expression: sum(fcut_slope * cap, over=generator) <= fcut_const
objective:
  sense: minimize
  expression: cap * invest + theta
