# PyPSA linear optimal power flow, rung 2: rung 1 plus generator ramp limits.
# Optimum 18200.0, from PyPSA itself.

dimensions:
  snapshot:
    dtype: int
  bus:
    dtype: str
  generator:
    dtype: str
  link:
    dtype: str

lookups:
  gen_bus: {over: generator, into: bus}  # every generator sits on a bus
  from: {over: link, into: bus}  # both endpoints are buses
  to: {over: link, into: bus}

parameters:
  p_nom:
    dims: [generator]
  marginal_cost:
    dims: [generator]
  ramp_limit_up:
    dims: [generator]
  ramp_limit_down:
    dims: [generator]
  rating:
    dims: [link]
  neg_rating:
    dims: [link]
  load:
    dims: [snapshot, bus]

variables:
  p:
    foreach: [snapshot, generator]
    bounds:
      lower: 0
      upper: p_nom
  f:
    foreach: [snapshot, link]
    bounds:
      lower: neg_rating
      upper: rating

constraints:
  nodal_balance:
    foreach: [snapshot, bus]
    expression: >-
      sum(p, by=gen_bus)
      + sum(f, by=to)
      - sum(f, by=from)
      == load

  ramp_up:
    foreach: [snapshot, generator]
    expression: p - shift(p, over=snapshot, by=1) <= ramp_limit_up * p_nom

  ramp_down:
    foreach: [snapshot, generator]
    expression: shift(p, over=snapshot, by=1) - p <= ramp_limit_down * p_nom

objective:
  sense: minimize
  expression: p * marginal_cost
