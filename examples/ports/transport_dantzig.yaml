# Dantzig's transportation problem (GAMS model library #1). Optimum 153.675,
# published with the model.

dimensions:
  plant:
    values: [seattle, san-diego]
  market:
    values: [new-york, chicago, topeka]

parameters:
  capacity:
    dims: [plant]
  demand:
    dims: [market]
  distance:
    dims: [plant, market]
  freight:
    dims: []

variables:
  shipment:
    foreach: [plant, market]
    bounds:
      lower: 0

constraints:
  within_capacity:
    foreach: [plant]
    expression: sum(shipment, over=market) <= capacity
  meet_demand:
    foreach: [market]
    expression: sum(shipment, over=plant) >= demand

objectives:
  total_cost:
    sense: minimize
  # f * d / 1000 in the source: arithmetic, not a precomputed cost table
    expression: shipment * distance * freight / 1000
