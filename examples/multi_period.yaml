dimensions:
  snapshot:
    dtype: int
  period:
    dtype: int
  generator:
    dtype: str

lookups:
  period_of: {over: snapshot, into: period}

parameters:
  load:
    dims: [snapshot]
  # what one snapshot stands for: a 2050 snapshot represents four hours, so the
  # operating cost of a coarse period is not understated against a fine one
  weight:
    dims: [snapshot]
  opex:
    dims: [generator]
  capex:
    dims: [generator, period]

variables:
  p:
    foreach: [snapshot, generator]
    bounds:
      lower: 0
  p_nom:
    foreach: [period, generator]
    bounds:
      lower: 0
      upper: 100

constraints:
  within_cap:
    foreach: [snapshot, generator]
    expression: p <= at(p_nom, by=period_of)
  balance:
    foreach: [snapshot]
    expression: sum(p, over=generator) == load

objective:
  sense: minimize
  expression: p * opex * weight + p_nom * capex
