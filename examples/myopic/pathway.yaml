description: >-
  One investment period: what to build, and how it runs on a few typical days.
  The model never mentions the period — the strategy filters every source to
  one year and drops the column, so this file is the math for a year and the
  driver decides which.
version: 0

dimensions:
  day: {dtype: str, description: "typical days, each standing for many real ones"}
  hour: {dtype: int, description: "hours within a typical day"}
  generator: {dtype: str, description: "generating units"}

parameters:
  weight: {dims: [day], description: "how many real days this typical day represents"}
  load: {dims: [day, hour], description: "demand to be met"}
  avail: {dims: [day, hour, generator], description: "capacity factor"}
  invest: {dims: [generator], description: "annualised build cost per MW"}
  cost: {dims: [generator], description: "variable cost per MWh"}
  existing: {dims: [generator], description: "capacity carried in from the previous period"}

variables:
  build:
    description: capacity added in this period
    foreach: [generator]
    bounds: {lower: 0}
  total:
    description: capacity standing after this period's build, and what the next period inherits
    foreach: [generator]
    bounds: {lower: 0}
  p:
    description: output of a generator in one hour of a typical day
    foreach: [day, hour, generator]
    bounds: {lower: 0}

constraints:
  accumulate:
    description: >-
      what stands is what was carried in plus what was built. The addition
      lives in the model rather than the driver because a carry is a copy and
      never arithmetic: accumulation is math, and math belongs in the file a
      reviewer reads and the oracle checks.
    foreach: [generator]
    expression: total == existing + build

  capacity:
    description: output is capped by the standing capacity, derated by availability
    foreach: [day, hour, generator]
    expression: p <= total * avail

  balance:
    description: the fleet meets the load exactly in every hour of every typical day
    foreach: [day, hour]
    expression: sum(p, over=generator) == load

objective:
  sense: minimize
  description: annualised cost of what is built, plus what running it costs across the year
  expression: sum(invest * build) + sum(weight * cost * p)
