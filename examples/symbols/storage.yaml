# The notation docs/models/storage.md already uses, written down.
#
#   python -m charter markdown examples/storage.yaml \
#       --symbols examples/symbols/storage.yaml
#
# That page writes $\mathrm{soc}_s = \mathrm{soc}_{s-1} + \eta\,\mathrm{charge}_s
# - \mathrm{discharge}_s$ by hand. The generated math says the same thing, with
# one difference worth keeping: the wraparound is *visible*. The page has to
# explain "with $s-1$ wrapping at the horizon" in prose underneath, because
# $s-1$ cannot say it; $s \ominus 1$ can, and the legend defines it.

notation: latex

dimensions:
  snapshot: {index: s, set: "\\mathcal{S}"}
  generator: {index: g, set: "\\mathcal{G}"}

names:
  cost: "c"
  load: "\\ell"
  p_max: "\\bar p"
  # Upright, as the gallery sets them: these are quantities named by a word,
  # not products of single-letter symbols.
  soc: "\\mathrm{soc}"
  charge: "\\mathrm{charge}"
  discharge: "\\mathrm{discharge}"
