# The notation docs/models/transport.md already uses, written down —
# with one deliberate departure.
#
#   python -m charter markdown examples/transport.yaml \
#       --symbols examples/symbols/transport.yaml
#
# The gallery writes $\sum_{g \in \mathrm{bus}} p_{s,g} + \sum_{\ell \to b}
# f_{s,\ell} - \sum_{\ell \,\text{from}\, b} f_{s,\ell} = \ell_{s,b}$, which
# uses $\ell$ for the line index *and* for the load. A reader has to
# disambiguate by position. A generated equation cannot make that choice
# silently, and this table will not either: lines keep $\ell$, load becomes
# $d$ (demand). Everything else matches the page.

notation: latex

dimensions:
  snapshot: {index: s, set: "\\mathcal{S}"}
  generator: {index: g, set: "\\mathcal{G}"}
  bus: {index: b, set: "\\mathcal{B}"}
  line: {index: "\\ell", set: "\\mathcal{L}"}

names:
  cost: "c"
  load: "d"
  p_max: "\\bar p"
  cap: "\\bar f"
  neg_cap: "\\underline{f}"
