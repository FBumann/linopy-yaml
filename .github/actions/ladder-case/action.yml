name: One case of the published ladder
description: >
  Measure one case on one sink, and upload what it produced before anything else
  can take the box.

# Results live only on the runner until an artifact step runs, and a runner that
# *dies* skips every remaining step — `if: always()` included. So a run that
# measured three cases and lost the box on the fourth came back with nothing at
# all (runs 12, 16, 18, 19 of the published benchmark). Uploading per case bounds
# that loss to the case the box died on.
#
# The path is the whole results directory rather than this case's file, so the
# newest artifact is the complete set and a reader needs only one.

inputs:
  sink:
    description: highs or gurobi
    required: true
  case:
    description: one of the published cases
    required: true
  sizes:
    description: rungs to measure; blank is the published ladder. A short list is how a change is proven end to end without spending hours on the rungs that are hard to hold.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        BENCH_SIZES: ${{ inputs.sizes }}
        SINK: ${{ inputs.sink }}
        CASE: ${{ inputs.case }}
      # `ladder-ci` starts the watchdog itself and traps it, so a run by hand is
      # watched the way this one is. Starting a second here would leave two
      # holding a `pkill` over one case.
      run: pixi run -e bench ladder-ci "$SINK" "$CASE"

    - if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: results-${{ inputs.sink }}-${{ inputs.case }}-${{ github.run_id }}
        path: bench/results
        retention-days: 90
