# The PyPSA parity gate. Every rung of math-spec's PyPSA corpus — checked out
# here at the ref pyproject.toml pins — a tag or, while the language is ahead
# of a release, a commit — so the corpus follows the language pin
# and nothing else — solves through PyPSA and through this tree's lpspec, and
# the runner compares them as deep as the engines allow: one objective and one
# set of prices across the fence everywhere, the two linopy models label for
# label where `lpspec.linopy` can build. A rung the linopy lane cannot build
# yet is stamped, not failed, so this job tightens by itself as the lane
# hardens.
#
# The certificate the runner writes, differential/pypsa/references.json, is
# committed; the last step fails when a run of this tree would rewrite it, so
# a stale stamp is a red diff rather than a passing string.
name: PyPSA parity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypsa-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: the corpus is math-spec at the ref pyproject.toml pins
        id: pin
        run: |
          ref=$(grep -o 'math-spec@[^"]*' pyproject.toml | cut -d@ -f2)
          test -n "$ref" || {
            echo "::error::no math-spec ref found in pyproject.toml. An empty ref checks out the default branch, so the ladder would run against a corpus this tree does not pin."
            exit 1
          }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: energy-models/math-spec
          ref: ${{ steps.pin.outputs.ref }}
          path: corpus
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: false
      - name: every rung against pypsa, with this tree's lpspec
        run: >
          pixi exec -s uv uv run
          --with-editable ".[linopy]"
          --with "pypsa==1.3.0" --with "highspy==1.15.1" --with "polars>=1.30"
          python differential/pypsa/parity.py corpus
      - name: the committed certificate, projections and tables are what this tree produces
        run: git diff --exit-code -- differential/pypsa && test -z "$(git status --porcelain differential/pypsa)"
