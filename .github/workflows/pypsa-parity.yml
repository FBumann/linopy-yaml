# The PyPSA parity gate. Every rung of the corpus under differential/pypsa/
# solves through PyPSA and through this tree's lpspec, and the runner compares
# them as deep as the engines allow: one objective and one set of prices
# across the fence everywhere, the two linopy models label for label where
# `lpspec.linopy` can build. A rung the linopy lane cannot build yet is
# stamped, not failed, so this job tightens by itself as the lane hardens.
#
# The certificate the runner writes, corpus/references.json, is committed
# beside the corpus; the last step fails when a run of this tree would rewrite
# it, so a stale stamp is a red diff rather than a passing string.
name: PyPSA parity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypsa-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: false
      - name: every rung against pypsa, with this tree's lpspec
        run: >
          pixi exec -s uv uv run
          --with-editable ".[linopy]"
          --with "pypsa==1.3.0" --with "highspy==1.15.1" --with "polars>=1.30"
          python differential/pypsa/parity.py
      - name: the committed certificate is what this tree produces
        run: git diff --exit-code -- differential/pypsa/corpus/references.json
