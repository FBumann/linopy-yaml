name: Published benchmark

# The comparison behind docs/about/benchmarks-scaling.html, on a box this run
# creates and deletes. Setup and why: bench/README.md
#
# Re-running a failed job does not work: provision succeeded, so a re-run
# reuses it and does not remake the box teardown has already deleted. Dispatch
# a new run instead.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'published: the whole ladder, hours. smoke: one rung, minutes.'
        type: choice
        options: [published, smoke]
        default: published
      sizes:
        description: 'Rungs to measure. Blank is the published ladder; "xs s m" is a short run that proves the pipeline in minutes.'
        type: string
        default: ''
      memory_budget:
        description: 'GB a cell may take before its arm stops climbing. Blank uses the published value; a lower one is a diagnostic run that completes and reports what each cell actually took.'
        type: string
        default: ''

jobs:
  provision:
    name: bring the box up
    runs-on: ubuntu-24.04
    if: vars.BENCH_RUNNER != ''
    steps:
      - uses: hetznercloud/setup-hcloud@v1
      - env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          BOX: ${{ vars.BENCH_RUNNER }}
          SNAPSHOT: ${{ vars.BENCH_SNAPSHOT }}
          TYPE: ${{ vars.BENCH_SERVER_TYPE || 'ccx33' }}
          LOCATION: ${{ vars.BENCH_LOCATION || 'nbg1' }}
          # Without a key Hetzner sets a root password and expires it, so the
          # first login is a forced password change rather than a shell.
          SSH_KEY: ${{ vars.BENCH_SSH_KEY }}
        run: |
          hcloud server delete "$BOX" 2>/dev/null || true
          hcloud server create --name "$BOX" --image "$SNAPSHOT" --type "$TYPE" \
            --location "$LOCATION" ${SSH_KEY:+--ssh-key "$SSH_KEY"} --start-after-create

  benchmark:
    needs: provision
    if: ${{ !cancelled() && needs.provision.result != 'failure' }}
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A warmed box carries ~/.cache/rattler and, alongside it, a pixi binary
      # that setup-pixi then refuses to overwrite. The cache is what was worth
      # warming; the binary is a few MB fetched every run anyway.
      - run: rm -f ~/.pixi/bin/pixi
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rattler/cache
          key: pixi-bench-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-bench-${{ runner.os }}-
      - run: pixi install -e bench

      # The committed results are a *previous* run's, and every case that
      # finishes overwrites its own file — so the ones left are exactly the
      # cases this run could not measure. Left in place they are published as
      # though it had: run 33481938841 killed `transport` and `storage` on
      # `highs`, and the page it rendered carried those two byte-identical to
      # what was committed, mixed in beside six fresh ones with nothing saying
      # so. A case this run cannot take is a gap, and a gap is honest.
      - run: rm -f bench/results/latest*.json

      - if: inputs.mode == 'smoke'
        run: pixi run -e bench ladder-smoke
      # One step per case, because a runner that dies takes its filesystem with
      # it and skips every step left — `if: always()` included. Each step
      # measures one case under `bench/memory-watchdog.sh` and uploads before the
      # next one can take the box.
      #
      # `!cancelled()`, not `always()`: a case runs when the one before it
      # failed, never when a human stopped the run. Each uploads what it
      # measured, so a box lost on the fourth case does not cost the three
      # before it (.github/actions/ladder-case).
      - if: inputs.mode != 'smoke'
        uses: ./.github/actions/ladder-case
        with:
          sink: highs
          case: dispatch
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: highs
          case: transport
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: highs
          case: storage
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: highs
          case: fleet
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: gurobi
          case: dispatch
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: gurobi
          case: transport
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: gurobi
          case: storage
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}
      - if: ${{ !cancelled() && inputs.mode != 'smoke' }}
        uses: ./.github/actions/ladder-case
        with:
          sink: gurobi
          case: fleet
          memory-budget: ${{ inputs.memory_budget }}
          sizes: ${{ inputs.sizes }}

      # After the run: ladder-ci is `pytest bench`, and two harness tests render them.

      - if: ${{ !cancelled() }}
        run: pixi run -e bench report
      - if: ${{ !cancelled() }}
        run: pixi run -e bench plot

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-benchmark-${{ github.run_id }}
          path: |
            bench/results
            docs/about/benchmarks.md
            docs/about/benchmarks-scaling.html
          retention-days: 90

  teardown:
    name: take the box down
    needs: [provision, benchmark]
    # A stopped Hetzner server bills like a running one; only delete stops it.
    # Hosted, so it cannot die with the box it is deleting.
    if: always() && vars.BENCH_RUNNER != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: hetznercloud/setup-hcloud@v1
      - env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          BOX: ${{ vars.BENCH_RUNNER }}
        run: |
          if hcloud server describe "$BOX" >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              hcloud server delete "$BOX" && break
              echo "delete failed, retry $attempt"; sleep 15
            done
          fi
          hcloud primary-ip delete "$BOX" 2>/dev/null || true
          hcloud server list
          hcloud primary-ip list
