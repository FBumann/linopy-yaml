name: Release

# Opens/maintains a release PR from conventional commits. Merging it tags the
# release, which is what publish.yaml reacts to. See RELEASING.md.
#
# TEMPORARY, WHILE ON THE ALPHA STREAM: the last step merges that PR for you, so
# every merge to main cuts a 0.0.1aN. It expires at the first official version.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target-branch:
        description: 'Release line to run against (e.g. a 0.1.x maintenance branch). Defaults to main.'
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ inputs.target-branch || github.ref_name }}
  cancel-in-progress: false

# secrets are not readable from a step-level `if`, so hoist the check here
env:
  HAS_RELEASE_APP: ${{ secrets.APP_CLIENT_ID != '' }}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Required, not preferred — same as prerelease.yaml, and for the same kind
      # of reason. A GITHUB_TOKEN-authored PR does not trigger CI, so falling
      # back to one produces a release PR whose required checks never report:
      # auto-merge then waits on a result that cannot arrive, which is the
      # failure #269 was reported as "CI hanging". A release that stops is
      # better than one that silently cannot finish.
      - name: Require the release app
        if: env.HAS_RELEASE_APP != 'true'
        run: |
          echo "::error::APP_CLIENT_ID is unset. A release PR authored with GITHUB_TOKEN does not"
          echo "::error::trigger CI, so its required checks never report and it cannot merge."
          echo "::error::Install the release app — see RELEASING.md."
          exit 1

      - uses: actions/create-github-app-token@v3
        id: app-token
        # No `if:` guard on the credentials, and none is possible on the thing
        # that actually matters: this needs the app *installed on the account
        # that owns the repository*, which no expression here can see. Moving
        # the repository is what separates the two — secrets transfer, the
        # installation does not — and the symptom is a bare `Not Found` from
        # this step. That reads as a bad key and is not one. See RELEASING.md.
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ inputs.target-branch || 'main' }}

      # ----------------------------------------------------------------------
      # TEMPORARY — alpha stream only. Delete this step and the project is back
      # to release PRs merged by hand, which is what RELEASING.md documents.
      # ----------------------------------------------------------------------
      # It exists so an alpha tester always has a version number to quote in a
      # bug report: every merge to main cuts a 0.0.1aN rather than being
      # reachable only as a commit sha.
      #
      # Expiry is enforced here, not remembered: the version comes off the PR
      # title and anything that is not a prerelease is left for a human. So the
      # first official release ends this by itself.
      #
      # Auto-merge rather than a direct merge: the ruleset's required checks have
      # not reported on the just-updated PR yet, so a direct merge would be
      # refused. GitHub merges it when they go green; if they fail, it sits there.
      #
      # Set the repo variable AUTO_RELEASE to "false" to pause it early and go
      # back to merging by hand. Requires "Allow auto-merge" on the repo.
      - name: Merge the release PR when CI passes (temporary, alpha only)
        if: vars.AUTO_RELEASE != 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # this job never checks out, so gh has no remote to infer the repo from
          GH_REPO: ${{ github.repository }}
          BASE: ${{ inputs.target-branch || 'main' }}
        run: |
          set -euo pipefail
          # resolve the PR from the API rather than the action's outputs: those
          # distinguish created from updated, and we want it merged either way
          read -r pr version < <(
            gh pr list --state open --base "$BASE" --json number,title,headRefName \
              --jq '[.[] | select(.headRefName | startswith("release-please--"))]
                    | first
                    | select(. != null)
                    | "\(.number) \(.title | split(" ") | last)"'
          ) || true

          if [[ -z "${pr:-}" ]]; then
            echo "no open release PR against $BASE — nothing to release"
            exit 0
          fi

          # 0.0.1-alpha.15 auto-merges; 0.1.0 does not. Dashed semver is the same
          # signal publish.yaml uses to mark a GitHub release as a prerelease.
          if [[ "$version" != *-* ]]; then
            echo "::notice::#$pr releases $version — the first official version is not automatic. Merge it yourself (RELEASING.md)."
            exit 0
          fi

          echo "enabling auto-merge on #$pr ($version) — temporary alpha-stream policy, see RELEASING.md"
          gh pr merge "$pr" --squash --auto
