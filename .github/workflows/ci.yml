name: CI

# Three jobs in parallel; `ci` runs nothing and reports whether they passed, so
# the branch ruleset keeps naming one fixed check.
#
# This was one job because billing is per job rounded up to the minute. That is
# a private-repository rule: GitHub bills no minutes for standard runners on a
# public one. What the single job cost instead was wall clock — the suite and
# the floors gate are both pytest, and neither could start until the other
# finished. The split is by environment, so nothing installs twice that did not
# install twice before.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # ~500 CPU-seconds on four cores: the long pole, and the only job anyone can
    # shorten.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # No `python-version:`: the interpreter is `[tool.pixi.dependencies]`, so
      # which Python a gate runs on has one home. `run-install: false` because
      # each job names its environment and pixi installs it on first use.
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: false

      # There is no `pixi.lock` — pyproject.toml says why — so what is cached is
      # the layer under it: conda packages, repodata, and uv's wheels. The solve
      # is paid every run, which is the point: `linopy@master` and `math-spec`
      # resolve fresh. A key per job, or whichever job saved first would decide
      # what the other two restore.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rattler/cache
          key: pixi-ci-suite-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-ci-suite-${{ runner.os }}-

      - run: pixi install -e default
      - run: pixi run lint
      - run: pixi run format-check
      # `github` is the task's `--output-format`, so a finding lands as an
      # annotation on the diff. Meaningless in the floors job: missing-import is
      # an error there, and the shipped shape has no linopy.
      - run: pixi run typecheck github
      - run: pixi run test

      # `testpaths` is `tests`, so the line above reaches no harness test. Four
      # bench entry points broke under `src/` refactors in one week (#1185,
      # #1245), every one already covered by a test nothing ran.
      - run: pixi run test-bench

  docs:
    # The tree as a document. Off the critical path, which is why TeX installs
    # in the foreground here — under `nohup` it only ever bought this overlap.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rattler/cache
          key: pixi-ci-docs-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-ci-docs-${{ runner.os }}-

      # texlive-latex-base carries geometry/amsmath (and pulls texlive-base for
      # amssymb.sty); texlive-fonts-recommended carries the msam/msbm fonts
      # amssymb *draws* with — \mathbb and \ominus are unset without them. A new
      # \usepackage in the preamble grows this list, which keeps the preamble
      # installable from a small TeX. The retry is for a slow apt mirror, which
      # killed four runs across three branches on 2026-08-19.
      - name: A minimal TeX
        run: |
          for attempt in 1 2 3; do
            timeout 120 sudo apt-get update -qq && break
            echo "apt-get update did not finish in 120s (attempt $attempt of 3)"
          done
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            texlive-latex-base texlive-fonts-recommended

      - run: pixi install -e docs

      # `strict: true` turns every warning into a failure, and the build runs
      # docs/interactive.ipynb, so a failing cell fails the gate. Same
      # environment `.readthedocs.yaml` builds, which is what stops CI and the
      # published site from drifting.
      - run: pixi run docs-build

      # Typst compiles in the suite as a pip wheel; LaTeX needs a toolchain, so
      # it compiles here. The suite's structural checks are what a *generator*
      # gets wrong — a malformed \mathcal or a missing \usepackage passes all of
      # them. Ports included: `examples/*.yaml` is not recursive and covers five
      # of sixteen (#282), and a port is where an unusual spelling first meets a
      # real TeX. One interpreter for all 55 models, because the process starts
      # were 24.2s of this step's 32.4s against 8.2s of pdflatex.
      - name: Every model renders to LaTeX that compiles
        # (the Typst half of this claim is `test_typst_output_compiles`)
        run: |
          mkdir -p "$RUNNER_TEMP/tex"
          pixi run -e docs python - "$RUNNER_TEMP/tex" \
            examples/*.yaml examples/ports/*.yaml <<'PY'
          import sys
          from pathlib import Path

          from math_spec.__main__ import main

          out, models = Path(sys.argv[1]), sys.argv[2:]
          for model in models:
              name = Path(model).stem
              argv = ['latex', model, '--standalone', '-o', str(out / f'{name}.tex')]
              symbols = Path('examples/symbols', f'{name}.yaml')
              if symbols.is_file():
                  argv += ['--symbols', str(symbols)]
              main(argv)
          PY
          printf '%s\0' "$RUNNER_TEMP"/tex/*.tex |
            xargs -0 -P "$(nproc)" -n1 pdflatex -halt-on-error \
              -interaction=nonstopmode -output-directory "$RUNNER_TEMP/tex"

  floors:
    # The shipped shape at the declared floors, proving two things: the
    # relational product needs no linopy, xarray, pandas or pyarrow, and the
    # lower bounds are real rather than decorative — `>=1.0` on duckdb once sat
    # five minors below the method the sink called.
    #
    # The environment names no extra on purpose: pixi solves each separately, so
    # the `[linopy]` extra's `polars>=1.31.1` cannot reach this solve and raise
    # the floor under test. The pins are checked by `tests/test_tooling_pins.py`
    # and the task asserts linopy is absent before running.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rattler/cache
          key: pixi-ci-floors-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pixi-ci-floors-${{ runner.os }}-
      - run: pixi run test-floors

  ci:
    # The single required check, named by the branch ruleset. `always()`, or one
    # failed job would leave this *skipped* — which GitHub reports as neither
    # passed nor failed, and a pull request merges over it.
    needs: [suite, docs, floors]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
