name: CodSpeed

# Cost, in the same terms as ci.yml and bench.yml: one billed job, ~3 minutes,
# on a free runner, with no secret to manage. CodSpeed is free for public
# repositories, so this is the cheapest way to run `bench/regressions/` and the
# only one that runs unasked.
#
# **It measures the suite that already exists.** `bench/` is one pytest-benchmark
# suite, and `--codspeed` swaps in CodSpeed's `benchmark` fixture where
# `--benchmark-memory` swaps in pytest-benchmem's. Same tests, same workloads, a
# different instrument — and the selection flags are the suite's own, so what
# runs here is a slice of what a contributor runs by hand rather than a copy of
# it. One lane and the small rung: this measures lpspec against itself, and the
# cross-lane comparison is the published ladder's job.
#
# What it buys over bench.yml, which already gates on memory: **the baseline**.
# bench.yml can only compare against a base it checks out and measures itself,
# which is two passes and the reason it has to be asked for with a label. This
# service stores the number for every commit on `main`, so a pull request gets
# the comparison for one pass.
#
# `memory`, and only `memory` — **and walltime is not an oversight, it is
# unavailable.** A shared runner's clock is the noise bench.yml already refuses
# to gate on, so walltime has to go on CodSpeed's bare-metal `codspeed-macro`
# runner, and those are *"only available for organizations and not for personal
# accounts"* (CodSpeed docs). This repository is owned by a user; linopy, whose
# workflow this one is shaped after, is owned by PyPSA, and that is the entire
# difference. Public repositories additionally have to allow the runners under
# Organization Settings > Actions > Runner groups > Default — a setting there is
# no organization to reach.
#
# So a walltime job here queues against a label nothing answers and sits until
# its timeout. #493 added one, briefly; this is what it cost to find out. Do not
# re-add it without an organization, and do not substitute a free runner for the
# macro one — that produces a series nobody can read, which is the thing the
# paragraph above is about.
#
# The gap it would have filled is real and remains open: bench.yml gates on
# memory, this job measures memory, and the wall-clock ladder is a thing a
# contributor runs by hand on an idle laptop, so **build CPU time is measured
# nowhere automatic**.
#
# `simulation` is CodSpeed's usual default and is wrong here for a different
# reason: it runs the workload under an emulator at a large multiple of real
# time, and polars is multi-threaded native code — the slowdown lands on the
# rungs and the thread count lands on the instruction count.
#
# Not a gate, on purpose. `continue-on-error` keeps it out of the merge
# decision and no branch ruleset names it; bench.yml stays the thing that fails
# a pull request. This one is a report that arrives without being asked, which
# is worth having precisely because it is not worth blocking on.
#
# **Nothing is measured until a maintainer connects the repository to the
# CodSpeed GitHub app.** Until then the job runs and uploads nothing. The wiring
# is OIDC (`id-token: write`), so there is no token secret either way.

on:
  push:
    branches: [main]
  # required for a report to have somewhere to land
  pull_request:
  # CodSpeed dispatches this itself to backfill a baseline for existing commits
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory:
    name: Memory (heap)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      id-token: write  # OIDC auth with CodSpeed — no upload token
    steps:
      - uses: actions/checkout@v7
        with:
          # nothing after this step talks to git, and the measured command is a
          # benchmark run under a third-party action — so the token has no
          # reason to be sitting in .git/config while it does
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          # the floor, and the only version CI tests — see ci.yml
          python-version: "3.11"
          enable-cache: true

      # `--no-default-groups` is the cost control: `dev` resolves linopy from a
      # git branch, and nothing measured here builds a linopy model. The
      # codspeed group declares the parquet writer the data generator needs, so
      # dropping the default groups costs nothing this job uses.
      - run: uv sync --no-default-groups --group codspeed

      # No data-warming step, unlike bench.yml. Generation happens once inside
      # the test and outside the measured region — the `benchmark` fixture times
      # the callable it is handed and nothing around it, so there is only one
      # pass for a cache to be cold on.
      #
      # `--sizes s` because CodSpeed's memory instrument tracks allocations
      # individually and its guidance is to stay under ~2M of them, which polars
      # may or may not respect at `m`. Widen it on evidence from this job rather
      # than on a guess made before it ever ran.
      - uses: CodSpeedHQ/action@v5
        with:
          mode: memory
          run: uv run --no-sync pytest bench --arms lpspec --sizes s --skip-gate --codspeed
